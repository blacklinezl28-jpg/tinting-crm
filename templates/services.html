{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <h4>Додати послугу</h4>
            <form action="/services/add" method="post">
                <div class="mb-3">
                    <label class="form-label">Назва послуги</label>
                    <input type="text" name="service_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ціна за замовчуванням (грн)</label>
                    <input type="number" step="0.01" name="default_price" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Зберегти послугу</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3 shadow-sm">
            <h4>Список послуг</h4>
            <table class="table table-striped mt-2">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Назва</th>
                        <th>Ціна (грн)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in services %}
                    <tr>
                        <td>{{ s.id }}</td>
                        <td>{{ s.service_name }}</td>
                        <td>{{ s.default_price }} грн</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
