<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування запису</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-4">
        <a href="/appointments" class="btn btn-secondary mb-3">← Назад до записів</a>
        <div class="card bg-secondary p-4 border-0">
            <h3>Деталі: {{ app.car_brand }} {{ app.car_model }} ({{ app.client_name }})</h3>
            <hr>
            
            <!-- Списання матеріалів -->
            <h5 class="mt-3">📦 Використані матеріали (списуються зі складу)</h5>
            <form action="/appointment/{{ app.id }}/use_material" method="post" class="row g-2">
                <div class="col-md-6">
                    <select name="inventory_id" class="form-select bg-dark text-light">
                        {% for item in inventory %}
                        <option value="{{ item.id }}">{{ item.item_name }} (залишок: {{ item.meters_left }} {{ item.unit }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" step="any" name="meters" class="form-control bg-dark text-light" placeholder="Кількість" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">Списати</button>
                </div>
            </form>

            <!-- Брак -->
            <h5 class="mt-4 text-danger">⚠️ Брак (врахувати у витрати)</h5>
            <form action="/appointment/{{ app.id }}/add_spoiled" method="post" class="row g-2">
                <div class="col-md-6">
                    <select name="inventory_id" class="form-select bg-dark text-light">
                        {% for item in inventory %}
                        <option value="{{ item.id }}">{{ item.item_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" step="any" name="meters" class="form-control bg-dark text-light" placeholder="Кількість браку" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-danger w-100">Додати брак</button>
                </div>
            </form>

            <!-- Фотозвіт (До / Після) -->
            <h5 class="mt-4">📸 Фотозвіт (До / Після)</h5>
            <form action="/appointment/{{ app.id }}/upload_photo" method="post" enctype="multipart/form-data" class="row g-2 mb-3">
                <div class="col-md-4">
                    <select name="photo_type" class="form-select bg-dark text-light">
                        <option value="До">До</option>
                        <option value="Після">Після</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <input type="file" name="file" class="form-control bg-dark text-light" accept="image/*" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Завантажити</button>
                </div>
            </form>

            <!-- Відображення завантажених фото -->
            {% if photos %}
            <div class="row g-3 mt-2">
                {% for photo in photos %}
                <div class="col-md-3 text-center">
                    <div class="card bg-dark border-light p-2">
                        <span class="badge bg-info mb-2 text-dark">{{ photo.photo_type }}</span>
                        <a href="/photo/{{ photo.id }}" target="_blank">
                            <img src="/photo/{{ photo.id }}" class="img-fluid rounded" style="max-height: 150px; object-fit: cover;" alt="Фото">
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
