<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад - CRM Tinting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-warning" href="/">🚗 Detailing CRM</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Головна</a>
                <a class="nav-link" href="/appointments">Записи</a>
                <a class="nav-link active" href="/inventory">Склад</a>
                <a class="nav-link" href="/reports">Звіти</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">📦 Облік складу та залишків плівки</h2>
        
        <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th>Назва матеріалу</th>
                        <th>Залишок</th>
                        <th>Мінімальний ліміт</th>
                        <th>Одиниця</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in inventory %}
                    <tr>
                        <td>{{ item.item_name }}</td>
                        <td>
                            <span class="fw-bold {% if item.meters_left <= item.min_limit %}text-danger{% else %}text-success{% endif %}">
                                {{ item.meters_left }}
                            </span>
                        </td>
                        <td>{{ item.min_limit }}</td>
                        <td>{{ item.unit }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">Склад порожній</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
